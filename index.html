<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <!-- viewport: щоб сторінка правильно масштабувалась на телефоні -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мої витрати</title>

  <!-- Офіційний скрипт Telegram: дає доступ до імені користувача, initData, вібрації тощо -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ===== Кольори в одному місці: змінюєш тут — змінюється весь дизайн ===== */
    :root {
      --bg: #F3F5F2;          /* фон сторінки */
      --card: #FFFFFF;        /* білі картки */
      --text: #14211C;        /* основний текст */
      --muted: #6B7A73;       /* сірий текст */
      --accent: #1FA97A;      /* головний зелений */
      --accent-dark: #127A57; /* темніший зелений для градієнта */
      --border: #E3E8E4;
      --danger: #D9534F;      /* червоний для помилок */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 110px; /* знизу місце під нижнє меню */
    }

    [hidden] { display: none !important; } /* все з атрибутом hidden — приховане */

    /* ===== Шапка: привітання + перемикач місяця ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .hello { font-size: 14px; color: var(--muted); }
    .title { font-size: 26px; font-weight: 800; }

    .month-switch {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
    }
    .month-switch button {
      border: none;
      background: var(--bg);
      width: 30px;
      height: 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text);
    }
    .month-label { text-align: center; min-width: 84px; }
    .month-label .m { font-weight: 700; font-size: 14px; }
    .month-label .y { font-size: 11px; color: var(--muted); }

    /* ===== Головна картка з сумою за місяць ===== */
    .main-card {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 14px;
    }
    .main-card .label { font-size: 14px; opacity: 0.85; }
    .main-card .total { font-size: 38px; font-weight: 800; margin: 6px 0 4px; }
    .main-card .hint { font-size: 13px; opacity: 0.85; }

    /* ===== Сітка 2x2 з маленькими картками ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }
    .stat .label { font-size: 12px; color: var(--muted); }
    .stat .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat .soon { font-size: 14px; color: var(--muted); margin-top: 6px; }

    /* ===== Блок зі списком ===== */
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }
    .section h2 { font-size: 16px; margin-bottom: 8px; }
    .empty { font-size: 14px; color: var(--muted); }
    .error { font-size: 14px; color: var(--danger); }

    /* Один рядок витрати */
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .item:last-child { border-bottom: none; }
    .item .cat { font-weight: 600; font-size: 15px; text-transform: capitalize; }
    .item .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item .right { display: flex; align-items: center; }
    .item .sum { font-weight: 700; font-size: 15px; white-space: nowrap; }

    /* Кнопка видалення в історії */
    .del-btn {
      background: none;
      border: none;
      font-size: 18px;
      padding: 6px;
      margin-left: 8px;
      cursor: pointer;
      opacity: 0.6;
    }
    .del-btn:disabled { opacity: 0.2; }

    /* ===== Екран історії ===== */
    .history-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .history-total .label { font-size: 14px; color: var(--muted); }
    .history-total .value { font-size: 22px; font-weight: 800; }

    /* Заголовок дня: "28 жовтня, ср" і сума за день */
    .day-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 2px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ===== Нижнє меню ===== */
    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 22px;
    }
    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      width: 60px;
    }
    .nav-item .icon { font-size: 20px; }
    .nav-item.active { color: var(--accent); font-weight: 700; }

    /* Кругла кнопка "+" по центру */
    .add-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 30px;
      margin-top: -30px; /* піднімаємо кнопку над меню */
      box-shadow: 0 6px 16px rgba(31, 169, 122, 0.4);
      cursor: pointer;
    }

    /* ===== Вікно додавання витрати (виїжджає знизу) ===== */
    .sheet-backdrop {
      position: fixed;
      inset: 0;                         /* на весь екран */
      background: rgba(0, 0, 0, 0.4);   /* напівпрозоре затемнення */
      display: flex;
      align-items: flex-end;            /* вікно притиснуте до низу */
      z-index: 10;
    }

    .sheet {
      background: var(--card);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 12px 16px 28px;
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin: 0 auto 14px;
    }
    .sheet h3 { font-size: 18px; margin-bottom: 12px; }

    .amount-input {
      width: 100%;
      font-size: 32px;
      font-weight: 800;
      border: none;
      border-bottom: 2px solid var(--border);
      padding: 6px 0;
      margin-bottom: 14px;
      outline: none;
      color: var(--text);
      background: transparent;
    }
    .amount-input:focus { border-bottom-color: var(--accent); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
    }
    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .category-input {
      width: 100%;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      outline: none;
      margin-bottom: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .category-input:focus { border-color: var(--accent); }

    .sheet-error {
      min-height: 20px;
      font-size: 14px;
      color: var(--danger);
      margin-bottom: 8px;
    }

    .sheet-actions { display: flex; gap: 10px; }
    .sheet-actions button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:disabled { opacity: 0.6; }
  </style>
</head>
<body>

  <!-- Шапка (спільна для всіх екранів) -->
  <div class="header">
    <div>
      <div class="hello" id="hello">Привіт!</div>
      <div class="title" id="screenTitle">Мої витрати</div>
    </div>
    <div class="month-switch">
      <button id="prevMonth">‹</button>
      <div class="month-label">
        <div class="m" id="monthName">—</div>
        <div class="y" id="yearName">—</div>
      </div>
      <button id="nextMonth">›</button>
    </div>
  </div>

  <!-- ===== ЕКРАН 1: Головна ===== -->
  <div id="homeScreen">
    <div class="main-card">
      <div class="label">Витрачено за місяць</div>
      <div class="total" id="total">…</div>
      <div class="hint" id="hint">Завантаження…</div>
    </div>

    <div class="grid">
      <div class="stat"><div class="label">Сьогодні</div><div class="value" id="today">…</div></div>
      <div class="stat"><div class="label">В середньому / день</div><div class="value" id="avg">…</div></div>
      <div class="stat"><div class="label">Доходи</div><div class="soon">скоро</div></div>
      <div class="stat"><div class="label">Залишок</div><div class="soon">скоро</div></div>
    </div>

    <div class="section">
      <h2>Останні витрати</h2>
      <div id="lastList"><div class="empty">Завантаження…</div></div>
    </div>
  </div>

  <!-- ===== ЕКРАН 2: Історія (прихований, поки не натиснули "Історія") ===== -->
  <div id="historyScreen" hidden>
    <div class="section">
      <div class="history-total">
        <span class="label">Всього за місяць</span>
        <span class="value" id="historyTotal">…</span>
      </div>
      <div id="historyList"><div class="empty">Завантаження…</div></div>
    </div>
  </div>

  <!-- Нижнє меню -->
  <nav class="nav">
    <button class="nav-item active" data-screen="home"><span class="icon">🏠</span>Головна</button>
    <button class="nav-item" data-screen="history"><span class="icon">📋</span>Історія</button>
    <button class="add-btn" id="addBtn">+</button>
    <button class="nav-item" data-soon="Статистика"><span class="icon">📊</span>Статистика</button>
    <button class="nav-item" data-soon="Налаштування"><span class="icon">⚙️</span>Ще</button>
  </nav>

  <!-- Вікно додавання витрати. Атрибут hidden — приховане, поки не натиснули "+" -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Нова витрата</h3>
      <!-- inputmode="decimal" — на телефоні відкриється цифрова клавіатура -->
      <input class="amount-input" id="amountInput" type="text" inputmode="decimal" placeholder="0,00 ₴" autocomplete="off">
      <div class="chips" id="chips"></div>
      <input class="category-input" id="categoryInput" type="text" maxlength="30" placeholder="Або своя категорія" autocomplete="off">
      <div class="sheet-error" id="sheetError"></div>
      <div class="sheet-actions">
        <button class="btn-secondary" id="cancelBtn">Скасувати</button>
        <button class="btn-primary" id="saveBtn">Зберегти</button>
      </div>
    </div>
  </div>

  <script>
    // Об'єкт Telegram WebApp. Поза Telegram теж існує, але без даних користувача
    const tg = window.Telegram.WebApp;
    tg.ready();   // кажемо Telegram, що сторінка завантажилась
    tg.expand();  // розгортаємо апку на весь екран

    // Адреса нашого API. Бот дописує її в посилання: ...github.io/expense-webapp/?api=https://...
    const API = new URLSearchParams(window.location.search).get("api");

    // Ім'я користувача з Telegram. "?." — якщо даних немає, не буде помилки
    const user = tg.initDataUnsafe?.user;
    if (user?.first_name) {
      document.getElementById("hello").textContent = `Привіт, ${user.first_name}!`;
    }

    // ===== Допоміжні функції =====

    // Показ повідомлення: в Telegram — гарне вікно, в браузері — звичайний alert
    function notify(text) {
      if (tg.initData) {
        tg.showAlert(text);
      } else {
        alert(text);
      }
    }

    // Питання "Так / Ні". Повертає true або false.
    // Promise — "обіцянка відповіді": ми чекаємо (await), поки людина натисне кнопку
    function askConfirm(text) {
      if (tg.initData) {
        return new Promise((resolve) => tg.showConfirm(text, resolve));
      }
      return Promise.resolve(confirm(text));
    }

    // Гроші у форматі "1 234,50 ₴"
    function money(value) {
      return value.toLocaleString("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₴";
    }

    // Дата '2026-10-26T19:30:00' -> '26.10, 19:30'
    function formatDate(iso) {
      return `${iso.slice(8, 10)}.${iso.slice(5, 7)}, ${iso.slice(11, 16)}`;
    }

    // Дата '2026-10-26' -> 'Сьогодні' / 'Вчора' / '26 жовтня, пн'
    const monthsGenitive = ["січня", "лютого", "березня", "квітня", "травня", "червня",
                            "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
    const weekdays = ["нд", "пн", "вт", "ср", "чт", "пт", "сб"];

    function dayTitle(dayIso) {
      const date = new Date(dayIso + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffDays = Math.round((today - date) / 86400000); // 86400000 мс = 1 доба
      if (diffDays === 0) return "Сьогодні";
      if (diffDays === 1) return "Вчора";
      return `${date.getDate()} ${monthsGenitive[date.getMonth()]}, ${weekdays[date.getDay()]}`;
    }

    // Чи можна взагалі звертатися до API
    function apiAvailable() {
      return Boolean(API && tg.initData);
    }

    // Текст помилки в будь-якому контейнері
    function showErrorIn(containerId, text) {
      const box = document.getElementById(containerId);
      box.innerHTML = "";
      const err = document.createElement("div");
      err.className = "error";
      err.textContent = text;
      box.appendChild(err);
    }

    // ===== ЕКРАН 1: Головна =====

    function showHomeError(text) {
      document.getElementById("total").textContent = "—";
      document.getElementById("today").textContent = "—";
      document.getElementById("avg").textContent = "—";
      document.getElementById("hint").textContent = text;
      showErrorIn("lastList", text);
    }

    // Намалювати "Останні витрати" на головній
    function renderLast(items) {
      const list = document.getElementById("lastList");
      list.innerHTML = "";

      if (items.length === 0) {
        list.innerHTML = '<div class="empty">У цьому місяці витрат немає.</div>';
        return;
      }

      items.forEach((item) => {
        // textContent замість вставки HTML: так "дивна" категорія від користувача не зламає сторінку
        const row = document.createElement("div");
        row.className = "item";

        const left = document.createElement("div");
        const cat = document.createElement("div");
        cat.className = "cat";
        cat.textContent = item.category;
        const date = document.createElement("div");
        date.className = "date";
        date.textContent = formatDate(item.created_at);
        left.append(cat, date);

        const sum = document.createElement("div");
        sum.className = "sum";
        sum.textContent = "−" + money(item.amount);

        row.append(left, sum);
        list.appendChild(row);
      });
    }

    async function loadSummary() {
      if (!API) { showHomeError("Відкрий апку через кнопку в боті"); return; }
      if (!tg.initData) { showHomeError("Відкрий апку всередині Telegram"); return; }

      document.getElementById("total").textContent = "…";
      document.getElementById("hint").textContent = "Завантаження…";

      const year = current.getFullYear();
      const month = current.getMonth() + 1; // у JS місяці від 0 до 11, тому +1
      const url = `${API}/api/summary?year=${year}&month=${month}&initData=${encodeURIComponent(tg.initData)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) { showHomeError(data.error || "Помилка сервера"); return; }

        document.getElementById("total").textContent = money(data.total);
        document.getElementById("today").textContent = money(data.today);
        document.getElementById("avg").textContent = money(data.avg_per_day);
        document.getElementById("hint").textContent = "Дані з твого бота";
        renderLast(data.last);
      } catch (e) {
        showHomeError("Сервер недоступний. Перевір, чи запущені API і тунель");
      }
    }

    // ===== ЕКРАН 2: Історія =====

    // Намалювати всі витрати місяця, згруповані по днях
    function renderHistory(items) {
      const list = document.getElementById("historyList");
      list.innerHTML = "";

      // Сума за місяць: reduce проходить по всіх витратах і додає суми
      const monthTotal = items.reduce((acc, item) => acc + item.amount, 0);
      document.getElementById("historyTotal").textContent = money(monthTotal);

      if (items.length === 0) {
        list.innerHTML = '<div class="empty" style="margin-top:10px">У цьому місяці витрат немає.</div>';
        return;
      }

      // 1. Групуємо: { '2026-10-28': [витрата, витрата], '2026-10-27': [...] }
      const groups = {};
      items.forEach((item) => {
        const day = item.created_at.slice(0, 10);
        if (!groups[day]) groups[day] = [];
        groups[day].push(item);
      });

      // 2. Малюємо кожен день: заголовок + його витрати
      Object.keys(groups).forEach((day) => {
        const dayItems = groups[day];
        const dayTotal = dayItems.reduce((acc, item) => acc + item.amount, 0);

        const header = document.createElement("div");
        header.className = "day-header";
        const title = document.createElement("span");
        title.textContent = dayTitle(day);
        const total = document.createElement("span");
        total.textContent = money(dayTotal);
        header.append(title, total);
        list.appendChild(header);

        dayItems.forEach((item) => {
          const row = document.createElement("div");
          row.className = "item";

          const left = document.createElement("div");
          const cat = document.createElement("div");
          cat.className = "cat";
          cat.textContent = item.category;
          const time = document.createElement("div");
          time.className = "date";
          time.textContent = item.created_at.slice(11, 16); // тільки час, день уже в заголовку
          left.append(cat, time);

          const right = document.createElement("div");
          right.className = "right";
          const sum = document.createElement("div");
          sum.className = "sum";
          sum.textContent = "−" + money(item.amount);

          const del = document.createElement("button");
          del.className = "del-btn";
          del.textContent = "🗑";
          del.onclick = () => deleteExpense(item, del);

          right.append(sum, del);
          row.append(left, right);
          list.appendChild(row);
        });
      });
    }

    async function loadHistory() {
      if (!API) { showErrorIn("historyList", "Відкрий апку через кнопку в боті"); return; }
      if (!tg.initData) { showErrorIn("historyList", "Відкрий апку всередині Telegram"); return; }

      document.getElementById("historyTotal").textContent = "…";

      const year = current.getFullYear();
      const month = current.getMonth() + 1;
      const url = `${API}/api/expenses?year=${year}&month=${month}&initData=${encodeURIComponent(tg.initData)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          showErrorIn("historyList", data.error || "Помилка сервера");
          return;
        }
        renderHistory(data.items);
      } catch (e) {
        showErrorIn("historyList", "Сервер недоступний. Перевір, чи запущені API і тунель");
      }
    }

    // Видалення однієї витрати (з підтвердженням)
    async function deleteExpense(item, button) {
      const ok = await askConfirm(`Видалити «${item.category}» на ${money(item.amount)}?`);
      if (!ok) return;

      button.disabled = true; // щоб не натиснули двічі

      try {
        // Знову POST без Content-Type — як при додаванні
        const response = await fetch(`${API}/api/expenses/delete`, {
          method: "POST",
          body: JSON.stringify({ initData: tg.initData, id: item.id }),
        });
        const data = await response.json();

        if (!response.ok) {
          notify(data.error || "Не вдалося видалити");
          button.disabled = false;
          return;
        }

        tg.HapticFeedback?.notificationOccurred("success");
        loadHistory(); // перемальовуємо список без видаленої витрати
      } catch (e) {
        notify("Сервер недоступний. Перевір API і тунель");
        button.disabled = false;
      }
    }

    // ===== Перемикання екранів =====
    let activeScreen = "home";

    function reloadActiveScreen() {
      if (activeScreen === "home") {
        loadSummary();
      } else {
        loadHistory();
      }
    }

    function showScreen(name) {
      activeScreen = name;
      document.getElementById("homeScreen").hidden = name !== "home";
      document.getElementById("historyScreen").hidden = name !== "history";
      document.getElementById("screenTitle").textContent = name === "home" ? "Мої витрати" : "Історія";

      // Підсвічуємо активну кнопку в меню
      document.querySelectorAll("[data-screen]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.screen === name);
      });

      window.scrollTo(0, 0); // на початок сторінки
      reloadActiveScreen();
    }

    document.querySelectorAll("[data-screen]").forEach((btn) => {
      btn.onclick = () => showScreen(btn.dataset.screen);
    });

    // ===== Перемикач місяців (працює для обох екранів) =====
    const months = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
                    "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
    let current = new Date(); // сьогоднішня дата
    current.setDate(1);       // перше число, щоб перемикання місяців не "стрибало" (31 жовтня -> 1 грудня)

    function renderMonth() {
      document.getElementById("monthName").textContent = months[current.getMonth()];
      document.getElementById("yearName").textContent = current.getFullYear();
    }

    document.getElementById("prevMonth").onclick = () => {
      current.setMonth(current.getMonth() - 1);
      renderMonth();
      reloadActiveScreen();
    };
    document.getElementById("nextMonth").onclick = () => {
      current.setMonth(current.getMonth() + 1);
      renderMonth();
      reloadActiveScreen();
    };

    // ===== Вікно додавання витрати =====
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const amountInput = document.getElementById("amountInput");
    const categoryInput = document.getElementById("categoryInput");
    const sheetError = document.getElementById("sheetError");
    const saveBtn = document.getElementById("saveBtn");
    const chipsBox = document.getElementById("chips");

    // Готові категорії-кнопки. Можеш змінити список під себе
    const presetCategories = ["їжа", "кава", "транспорт", "покупки", "розваги", "інше"];

    // Підсвітити кнопку категорії, якщо її текст збігається з полем вводу
    function highlightChips() {
      const value = categoryInput.value.trim().toLowerCase();
      chipsBox.querySelectorAll(".chip").forEach((chip) => {
        chip.classList.toggle("selected", chip.textContent === value);
      });
    }

    presetCategories.forEach((name) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = name;
      chip.onclick = () => {
        categoryInput.value = name;
        highlightChips();
      };
      chipsBox.appendChild(chip);
    });
    categoryInput.oninput = highlightChips;

    function openSheet() {
      if (!apiAvailable()) {
        notify("Відкрий апку через кнопку в боті");
        return;
      }
      amountInput.value = "";
      categoryInput.value = "";
      sheetError.textContent = "";
      highlightChips();
      sheetBackdrop.hidden = false;
      amountInput.focus();
    }

    function closeSheet() {
      sheetBackdrop.hidden = true;
    }

    async function saveExpense() {
      const amount = parseFloat(amountInput.value.replace(",", "."));
      if (!amount || amount <= 0) {
        sheetError.textContent = "Введи суму більше нуля";
        return;
      }
      const category = categoryInput.value.trim() || "інше";

      saveBtn.disabled = true;
      saveBtn.textContent = "Збереження…";
      sheetError.textContent = "";

      try {
        // POST — запит, який щось змінює на сервері (GET тільки читає)
        // Заголовок Content-Type не ставимо: тоді браузер шле текст без додаткової CORS-перевірки
        const response = await fetch(`${API}/api/expenses`, {
          method: "POST",
          body: JSON.stringify({ initData: tg.initData, amount: amount, category: category }),
        });
        const data = await response.json();

        if (!response.ok) {
          sheetError.textContent = data.error || "Не вдалося зберегти";
          return;
        }

        tg.HapticFeedback?.notificationOccurred("success");
        closeSheet();

        // Повертаємось на поточний місяць і оновлюємо екран, де зараз користувач
        current = new Date();
        current.setDate(1);
        renderMonth();
        reloadActiveScreen();
      } catch (e) {
        sheetError.textContent = "Сервер недоступний. Перевір API і тунель";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Зберегти";
      }
    }

    document.getElementById("addBtn").onclick = openSheet;
    document.getElementById("cancelBtn").onclick = closeSheet;
    saveBtn.onclick = saveExpense;

    // Клік по темному фону (поза вікном) — закрити
    sheetBackdrop.onclick = (event) => {
      if (event.target === sheetBackdrop) closeSheet();
    };

    // ===== Кнопки меню, які ще не працюють =====
    document.querySelectorAll("[data-soon]").forEach((btn) => {
      btn.onclick = () => notify(`Розділ «${btn.dataset.soon}» скоро буде`);
    });

    // Старт
    renderMonth();
    loadSummary();
  </script>
</body>
</html>
